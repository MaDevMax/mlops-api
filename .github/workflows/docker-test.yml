name: Docker Build and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t mlops-api .

      - name: Run container
        run: |
          docker run -d -p 8000:8000 --name mlops-container mlops-api
          sleep 5

      - name: Test /health endpoint
        run: |
          curl -f http://localhost:8000/health

      - name: Test /predict endpoint
        run: |
          RESPONSE=curl -s http://localhost:8000/predict?x=100
          echo "Response: "
          echo "" | grep -q "251.3"

      - name: Stop container
        run: docker stop mlops-container
